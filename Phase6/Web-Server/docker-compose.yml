services:
  postgres:
    image: postgres:16-alpine
    container_name: articleshare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-articleshare}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env, see .env.example}
    # Not published to the host: only containers on articleshare-net (i.e. the
    # backend) need to reach Postgres, so there is no reason to expose 5432
    # outside the Docker network.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - articleshare-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-articleshare}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MAVEN_MIRROR_URL: ${MAVEN_MIRROR_URL:-}
    container_name: articleshare-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-articleshare}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env, see .env.example}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env, see .env.example}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-1440}
    networks:
      - articleshare-net

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    container_name: articleshare-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - articleshare-net

networks:
  articleshare-net:
    driver: bridge

volumes:
  # Named volume so article/user data in Postgres survives container recreation
  # (containers themselves are ephemeral; this volume is not).
  postgres_data:
