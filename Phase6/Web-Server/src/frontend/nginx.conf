server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy: same-origin requests to /api/* are forwarded to the backend
    # container. The frontend's own code only ever talks to "/api/...", it never
    # needs to know the backend's real host/port -- that's the point of putting
    # Nginx in front as a reverse proxy.
    location /api/ {
        proxy_pass http://backend:9092/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router uses client-side routing, so any path that isn't a real static
    # file must fall back to index.html and let the SPA router handle it.
    location / {
        try_files $uri /index.html;
    }
}
