spring.datasource.url=jdbc:postgresql://localhost:5432/articleshare
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# HMAC-SHA256 signing key for JWTs. Override with the JWT_SECRET env var in real
# deployments -- this value is only a convenience default for local development.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-please-0123456789}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}
